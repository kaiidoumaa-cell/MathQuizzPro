<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKA Math Challenge - 12 Minggu Belajar Terstruktur</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary);
            margin: 0 0 8px 0;
            font-size: 1.8rem;
        }

        .motto {
            font-size: 0.9rem;
            color: #64748b;
            font-style: italic;
        }

        .grid-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .module-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .module-btn:hover {
            border-color: var(--accent);
            background: #eff6ff;
        }

        .module-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .module-btn strong {
            display: block;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .quiz-box, .result-box {
            display: none;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .opt-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .opt-btn:hover {
            background: #e2e8f0;
        }

        .opt-btn.correct {
            background: #dcfce7 !important;
            border-color: var(--success) !important;
            color: var(--success);
        }

        .opt-btn.wrong {
            background: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: var(--danger);
        }

        .explanation {
            margin-top: 15px;
            padding: 12px;
            background: #eff6ff;
            border-left: 4px solid var(--accent);
            border-radius: 4px;
            display: none;
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .badge-green { background: var(--success); }
        .badge-yellow { background: var(--warning); }
        .badge-red { background: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>TKA MATH CHALLENGE</h1>
        <div class="motto">"Disiplin hari ini, Prestasi esok hari!" — 12 Minggu Belajar Terstruktur</div>
    </header>

    <!-- SETUP VIEW -->
    <div id="setup-view">
        <p><strong>Pilih Modul Pembelajaran:</strong></p>
        <div class="grid-selector" id="module-selector"></div>
        <button class="btn-action" onclick="startQuiz()">Mulai Tantangan</button>
    </div>

    <!-- QUIZ VIEW -->
    <div id="quiz-view" class="quiz-box">
        <div class="stats-bar">
            <span>Soal: <span id="q-num">1</span>/10</span>
            <span>Modul: <span id="module-label">-</span></span>
            <span>Skor: <span id="score-val">0</span></span>
        </div>
        <div class="question-text" id="q-text">Pertanyaan akan muncul di sini...</div>
        <div class="options-grid" id="options-container"></div>
        <div class="explanation" id="explanation-box"></div>
        <button class="btn-action" id="next-btn" style="display:none;" onclick="nextQuestion()">Soal Berikutnya</button>
    </div>

    <!-- RESULT VIEW -->
    <div id="result-view" class="result-box">
        <h2>Hasil Evaluasi Modul</h2>
        <p>Skor Akhir Anda: <strong id="final-score" style="font-size: 1.5rem;">0%</strong></p>
        <div id="status-badge" style="margin-bottom: 15px;"></div>
        <div id="recommendation" style="margin-bottom: 20px; padding: 12px; background: #f1f5f9; border-radius: 6px;"></div>
        <button class="btn-action" onclick="resetQuiz()">Pilih Modul Lain</button>
    </div>
</div>

<script>
const modules = [
    { id: 0, title: "Aritmatika Dasar", desc: "Penjumlahan, Pengurangan, Perkalian, Pembagian, Akar Pangkat 2 & 3" },
    { id: 1, title: "Minggu 1: Bilangan & Operasi", desc: "Pecahan, persen, rasio, pangkat & notasi ilmiah" },
    { id: 2, title: "Minggu 2: Aljabar Dasar", desc: "Bentuk aljabar, persamaan & pertidaksamaan linear" },
    { id: 3, title: "Minggu 3: Fungsi & Grafik", desc: "Fungsi linear, fungsi kuadrat & sifat grafik" },
    { id: 4, title: "Minggu 4: SPL & Sistem Persamaan", desc: "SPLDV, SPLTV & Soal cerita" },
    { id: 5, title: "Minggu 5: Geometri", desc: "Bangun datar, bangun ruang, luas, keliling & volume" },
    { id: 6, title: "Minggu 6: Trigonometri", desc: "Sin, Cos, Tan, Sudut istimewa & Identitas" },
    { id: 7, title: "Minggu 7: Geometri Analitik", desc: "Titik, jarak, gradien & persamaan garis" },
    { id: 8, title: "Minggu 8: Peluang", desc: "Peluang dasar, permutasi & kombinasi" },
    { id: 9, title: "Minggu 9: Statistika", desc: "Mean, median, modus, kuartil & interpretasi data" },
    { id: 10, title: "Minggu 10: Eksponen & Logaritma", desc: "Sifat pangkat, akar & logaritma dasar" },
    { id: 11, title: "Minggu 11: Kalkulus Dasar", desc: "Limit fungsi, turunan & aplikasi" },
    { id: 12, title: "Minggu 12: Mixed TKA & Simulasi", desc: "Campuran seluruh materi TKA" }
];

let selectedModule = 0;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;

function init() {
    const container = document.getElementById('module-selector');
    container.innerHTML = '';
    modules.forEach(m => {
        const btn = document.createElement('div');
        btn.className = `module-btn ${m.id === selectedModule ? 'active' : ''}`;
        btn.onclick = () => selectModule(m.id);
        btn.innerHTML = `<strong>${m.title}</strong><span style="font-size:0.8rem;">${m.desc}</span>`;
        container.appendChild(btn);
    });
}

function selectModule(id) {
    selectedModule = id;
    init();
}

function generateQuestions(modId) {
    let qList = [];
    for (let i = 0; i < 10; i++) {
        let q = {};
        let activeMod = modId === 12 ? Math.floor(Math.random() * 11) : modId;

        if (activeMod === 0) {
            // Aritmatika Dasar & Akar
            let type = Math.floor(Math.random() * 3);
            if (type === 0) {
                let a = Math.floor(Math.random() * 10) + 1, b = Math.floor(Math.random() * 10) + 1;
                q = { q: `${a} × ${b} = ?`, ans: a * b, exp: `Perkalian dasar ${a} dikali ${b} = ${a*b}` };
            } else if (type === 1) {
                let val = Math.floor(Math.random() * 20) + 1;
                q = { q: `√${val * val} = ?`, ans: val, exp: `Akar pangkat 2 dari ${val*val} adalah ${val}` };
            } else {
                let val = Math.floor(Math.random() * 10) + 1;
                q = { q: `∛${val * val * val} = ?`, ans: val, exp: `Akar pangkat 3 dari ${val*val*val} adalah ${val}` };
            }
        } else if (activeMod === 2) {
            // Aljabar
            let a = Math.floor(Math.random() * 5) + 2, b = Math.floor(Math.random() * 10) + 1;
            let x = Math.floor(Math.random() * 8) + 1;
            let c = a * x + b;
            q = { q: `Selesaikan persamaan: ${a}x + ${b} = ${c}. Berapakah x?`, ans: x, exp: `${a}x = ${c} - ${b} ➔ ${a}x = ${c-b} ➔ x = ${x}` };
        } else if (activeMod === 6) {
            // Trigonometri
            const angles = [0, 30, 45, 60, 90];
            const sinVals = { 0: "0", 30: "0.5", 45: "0.71", 60: "0.87", 90: "1" };
            let ang = angles[Math.floor(Math.random() * angles.length)];
            q = { q: `Berapakah nilai dari sin(${ang}°)?`, ans: sinVals[ang], exp: `Sudut istimewa sin(${ang}°) = ${sinVals[ang]}` };
        } else if (activeMod === 11) {
            // Kalkulus (Turunan)
            let n = Math.floor(Math.random() * 4) + 2;
            q = { q: `Turunan pertama d/dx dari f(x) = x^${n} adalah...`, ans: `${n}x^${n-1}`, exp: `Gunakan rumus d/dx(x^n) = n·x^(n-1)` };
        } else {
            // Generic Fallback Question Generator
            let a = Math.floor(Math.random() * 10) + 2;
            let b = Math.floor(Math.random() * 10) + 2;
            q = { q: `[Modul ${activeMod}] Berapakah nilai dari ${a} + ${b} × 2?`, ans: a + (b * 2), exp: `Dahulukan perkalian: ${b} × 2 = ${b*2}, lalu tambahkan ${a} = ${a + b*2}` };
        }

        // Generate Options
        let correct = q.ans;
        let opts = new Set([correct]);
        while (opts.size < 4) {
            if (typeof correct === 'number') {
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                opts.add(correct + offset);
            } else {
                opts.add(`${Math.floor(Math.random()*5)+1}x^${Math.floor(Math.random()*3)}`);
            }
        }

        q.options = Array.from(opts).sort(() => Math.random() - 0.5);
        qList.push(q);
    }
    return qList;
}

function startQuiz() {
    currentQuestions = generateQuestions(selectedModule);
    currentIndex = 0;
    score = 0;
    document.getElementById('setup-view').style.display = 'none';
    document.getElementById('quiz-view').style.display = 'block';
    document.getElementById('module-label').innerText = modules.find(m => m.id === selectedModule).title.split(':')[0];
    showQuestion();
}

function showQuestion() {
    let q = currentQuestions[currentIndex];
    document.getElementById('q-num').innerText = currentIndex + 1;
    document.getElementById('score-val').innerText = score;
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('explanation-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    const optContainer = document.getElementById('options-container');
    optContainer.innerHTML = '';
    q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, opt, q.ans, q.exp);
        optContainer.appendChild(btn);
    });
}

function checkAnswer(selectedBtn, chosen, correct, exp) {
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(btn => btn.disabled = true);

    if (String(chosen) === String(correct)) {
        selectedBtn.classList.add('correct');
        score += 10;
    } else {
        selectedBtn.classList.add('wrong');
        allBtns.forEach(btn => {
            if (String(btn.innerText) === String(correct)) btn.classList.add('correct');
        });
    }

    const expBox = document.getElementById('explanation-box');
    expBox.innerHTML = `<strong>Pembahasan:</strong> ${exp}`;
    expBox.style.display = 'block';
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('result-view').style.display = 'block';
    
    let percentage = (score / 100) * 100;
    document.getElementById('final-score').innerText = `${percentage}%`;

    let badge = document.getElementById('status-badge');
    let rec = document.getElementById('recommendation');

    if (percentage >= 80) {
        badge.innerHTML = `<span class="badge badge-green">LULUS (≥ 80%)</span>`;
        rec.innerHTML = `<strong>Hasil Bagus!</strong> Anda siap untuk lanjut ke modul materi berikutnya.`;
    } else if (percentage >= 60) {
        badge.innerHTML = `<span class="badge badge-yellow">REMEDIAL (60-79%)</span>`;
        rec.innerHTML = `<strong>Penguatan Konsep:</strong> Disarankan melakukan remediasi dan mengulang latihan soal variasi.`;
    } else {
        badge.innerHTML = `<span class="badge badge-red">ULANG KONSEP (< 60%)</span>`;
        rec.innerHTML = `<strong>Perlu Evaluasi:</strong> Pelajari kembali materi dasar pada modul ini sebelum mengambil tes ulang.`;
    }
}

function resetQuiz() {
    document.getElementById('result-view').style.display = 'none';
    document.getElementById('setup-view').style.display = 'block';
    init();
}

// Initial Run
init();
</script>
</body>
</html>
